<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Ide+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho escuro com logo e abas; abaixo, uma página por aba com cartões largos. Um único bloco de CSS, tokens no :root. */
:root {
  color-scheme: light;
  --bg: #F6F3FA; --surface: #FFFFFF; --ink: #21192B; --muted: #6B6377; --line: #E5DEEE;
  --primary: #2D1746; --on-primary: #FFFFFF; --accent: #C52B7C; --soft: #F3ECF8;
  --hdr1: #20112F; --hdr2: #3A1F56;
  --s0-bg: #EEE9F3; --s0-fg: #554C63;
  --s1-bg: #FCEFD3; --s1-fg: #74500F;
  --s2-bg: #E3EAFA; --s2-fg: #2E4D82;
  --s3-bg: #DDF1E6; --s3-fg: #1F6446;
  --s4-bg: #2D1746; --s4-fg: #FFFFFF;
  --bad-bg: #FBE1E8; --bad-fg: #9A1B47;
  --c-ig: #C52B7C; --c-fb: #2D1746; --c-tt: #0E8F8F;
  --shadow: 0 4px 16px rgba(31, 19, 46, .05);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", -apple-system, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #150C22; --surface: #211333; --ink: #F4EBFB; --muted: #B7A6CB; --line: #3A2653;
    --primary: #C9A6F0; --on-primary: #1B0D2B; --accent: #FF7AB0; --soft: #2B1A44;
    --hdr1: #1B0F2A; --hdr2: #2F1B48;
    --s0-bg: #34264A; --s0-fg: #D8CBE8;
    --s1-bg: #4A3510; --s1-fg: #FFD98A;
    --s2-bg: #1E3358; --s2-fg: #B5D0FF;
    --s3-bg: #17402A; --s3-fg: #A8E8BE;
    --s4-bg: #C9A6F0; --s4-fg: #1B0D2B;
    --bad-bg: #4C1730; --bad-fg: #FFB3CB;
    --c-ig: #FF7AB0; --c-fb: #B58CE8; --c-tt: #4FD1C5;
    --shadow: 0 4px 16px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #150C22; --surface: #211333; --ink: #F4EBFB; --muted: #B7A6CB; --line: #3A2653;
  --primary: #C9A6F0; --on-primary: #1B0D2B; --accent: #FF7AB0; --soft: #2B1A44;
  --hdr1: #1B0F2A; --hdr2: #2F1B48;
  --s0-bg: #34264A; --s0-fg: #D8CBE8;
  --s1-bg: #4A3510; --s1-fg: #FFD98A;
  --s2-bg: #1E3358; --s2-fg: #B5D0FF;
  --s3-bg: #17402A; --s3-fg: #A8E8BE;
  --s4-bg: #C9A6F0; --s4-fg: #1B0D2B;
  --bad-bg: #4C1730; --bad-fg: #FFB3CB;
  --c-ig: #FF7AB0; --c-fb: #B58CE8; --c-tt: #4FD1C5;
  --shadow: 0 4px 16px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 12px; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 28px 70px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; letter-spacing: -0.02em; }
h2 { font-size: 21px; color: var(--primary); }
h3 { font-size: 17px; }
h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.tnum, td, .kpi b, .d { font-variant-numeric: tabular-nums; }
.col { display: flex; flex-direction: column; gap: 16px; }
.none { color: var(--muted); font-size: 14px; }

/* Cabeçalho: escuro nos dois temas, por isso usa cores fixas */
.top { display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: center; justify-content: space-between; padding: 28px 32px; border-radius: 24px;
  background: linear-gradient(135deg, var(--hdr1) 0%, #2C1841 58%, var(--hdr2) 100%); box-shadow: 0 18px 40px rgba(32, 20, 45, .16); position: relative; overflow: hidden; }
.top::after { content: ""; position: absolute; right: -50px; bottom: -60px; width: 240px; height: 240px; background: radial-gradient(circle, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 72%); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 18px; min-width: 0; position: relative; z-index: 1; }
.logo-badge { background: #fff; border-radius: 18px; padding: 12px 18px; display: flex; flex: none; box-shadow: 0 10px 26px rgba(0,0,0,.14); }
.ide-official-logo { display: block; height: 52px; width: auto; max-width: 190px; object-fit: contain; }
.brand h1 { color: #fff; font-size: 24px; margin-bottom: 4px; }
.brand p { color: #D7CDDF; font-size: 13.5px; max-width: 560px; }
.tabs { display: flex; gap: 3px; padding: 4px; border-radius: 13px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.08); position: relative; z-index: 1; max-width: 100%; overflow-x: auto; }
.tab { border: 0; background: transparent; color: #E3D9EA; padding: 9px 13px; border-radius: 9px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.tab:hover { background: rgba(255,255,255,.13); }
.tab[aria-selected="true"] { background: #fff; color: #281738; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.tab .badge { margin-left: 6px; background: #F5A3C7; color: #4B0F2A; border-radius: 999px; padding: 0 7px; font-size: 12px; }
.notice { background: var(--s1-bg); color: var(--s1-fg); padding: 11px 16px; border-radius: 12px; font-size: 14px; }
.notice.bad { background: var(--bad-bg); color: var(--bad-fg); }

/* Peças comuns */
.panel { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn:disabled { opacity: .5; cursor: default; }
a.btn { text-decoration: none; display: inline-block; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 15px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.pill[data-s="0"] { background: var(--s0-bg); color: var(--s0-fg); }
.pill[data-s="1"] { background: var(--s1-bg); color: var(--s1-fg); }
.pill[data-s="2"] { background: var(--s2-bg); color: var(--s2-fg); }
.pill[data-s="3"] { background: var(--s3-bg); color: var(--s3-fg); }
.pill[data-s="4"] { background: var(--s4-bg); color: var(--s4-fg); }
.pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
.pill.warn { background: var(--s1-bg); color: var(--s1-fg); }
.pill.good { background: var(--s3-bg); color: var(--s3-fg); }
select.st { appearance: none; border: 0; border-radius: 999px; padding: 7px 28px 7px 13px; font-weight: 600; font-size: 13.5px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
select.st:disabled { opacity: 1; cursor: default; background-image: none; padding-right: 13px; }
select.st[data-s="0"] { background-color: var(--s0-bg); color: var(--s0-fg); }
select.st[data-s="1"] { background-color: var(--s1-bg); color: var(--s1-fg); }
select.st[data-s="2"] { background-color: var(--s2-bg); color: var(--s2-fg); }
select.st[data-s="3"] { background-color: var(--s3-bg); color: var(--s3-fg); }
select.st[data-s="4"] { background-color: var(--s4-bg); color: var(--s4-fg); }
input[type="number"], input[type="url"], input[type="text"], input[type="date"], input[type="time"], textarea, select.plain {
  border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 8px 10px; width: 100%; min-width: 0; color: var(--ink); }
textarea { resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--muted); text-align: center; }
.scroll { overflow-x: auto; }
.prog { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; min-width: 80px; }
.prog i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }

/* KPIs e resumo */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 16px 18px; text-align: left; display: flex; flex-direction: column; gap: 7px; }
.stat b { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.stat span { align-self: flex-start; }
.stat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 3px; }
.kpi b { font-family: var(--font-display); font-size: 31px; line-height: 1.05; color: var(--primary); }
.kpi span { color: var(--muted); font-size: 13.5px; }
.next { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; background: var(--primary); color: var(--on-primary); border-radius: 16px; padding: 18px 22px; }
.next small { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 11.5px; opacity: .85; }
.next strong { font-family: var(--font-display); font-size: 20px; }
.next .btn-link { margin-left: auto; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 9px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; }

/* Atenção */
.attn { border-color: var(--accent); }
.attn.ok { border-color: var(--line); }
.attn h2 { display: flex; gap: 10px; align-items: center; }
.attn h2 .count { font-size: 13px; background: var(--bad-bg); color: var(--bad-fg); border-radius: 999px; padding: 1px 10px; font-family: var(--font-body); }
.attn-list { list-style: none; padding: 0 !important; display: flex; flex-direction: column; gap: 8px !important; }
.attn-list li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.attn-list .txt { flex: 1 1 260px; min-width: 0; }

/* Posts e stories */
.week { display: flex; flex-direction: column; gap: 10px; }
.week > h2 { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 19px; padding: 4px 2px; }
.week > h2 small { font-family: var(--font-body); font-weight: 500; font-size: 13.5px; color: var(--muted); }
.post { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; overflow: hidden; }
.post.today { border-color: var(--accent); }
.post .row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding: 16px 20px; }
.date { width: 58px; flex: none; text-align: center; background: var(--soft); border-radius: 10px; padding: 8px 0; display: flex; flex-direction: column; line-height: 1.1; }
.date .d { font-family: var(--font-display); font-size: 25px; font-weight: 700; color: var(--primary); }
.date .w, .date .m { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.main { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 12.5px; color: var(--muted); }
.net { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--soft); color: var(--primary); }
.side { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.detail { border-top: 1px solid var(--line); padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px 28px; }
.detail > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.checks { list-style: none !important; margin: 0; padding: 0 !important; display: flex; flex-direction: column; gap: 8px !important; }
.checks label { display: flex; gap: 8px; align-items: flex-start; }
.checks input { margin-top: 4px; accent-color: var(--accent); }
.checks .done span { text-decoration: line-through; color: var(--muted); }
.story-screens { display: flex; flex-direction: column; gap: 9px; }
.story-screen { border: 1px solid var(--line); background: var(--bg); border-radius: 11px; padding: 10px 13px; }
.story-screen-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
.story-screen-head b { font-size: 13px; color: var(--primary); }
.story-screen-head span { font-size: 11px; color: var(--muted); }
.story-screen p { overflow-wrap: anywhere; }
.warnbox { background: var(--s1-bg); color: var(--s1-fg); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }

/* Calendário e barras */
.cal { min-width: 600px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 2px 4px; }
.cal .c { min-height: 92px; border-radius: 9px; background: var(--bg); padding: 5px; display: flex; flex-direction: column; gap: 3px; border: 1px solid var(--line); }
.cal .c.off { background: transparent; border-color: transparent; }
.cal .c.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cal .n { font-size: 12px; color: var(--muted); font-weight: 600; }
.cal .e { text-align: left; border: 0; border-radius: 6px; padding: 4px 6px; font-size: 12px; line-height: 1.25; font-weight: 600; }
.cal .e[data-s="0"] { background: var(--s0-bg); color: var(--s0-fg); }
.cal .e[data-s="1"] { background: var(--s1-bg); color: var(--s1-fg); }
.cal .e[data-s="2"] { background: var(--s2-bg); color: var(--s2-fg); }
.cal .e[data-s="3"] { background: var(--s3-bg); color: var(--s3-fg); }
.cal .e[data-s="4"] { background: var(--s4-bg); color: var(--s4-fg); }
.cal .sd { border: 0; background: transparent; padding: 0; display: flex; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
.cal .sd i { width: 9px; height: 9px; border-radius: 50%; background: var(--s0-fg); display: inline-block; }
.cal .sd[data-s="1"] i { background: var(--s1-fg); } .cal .sd[data-s="2"] i { background: var(--s2-fg); }
.cal .sd[data-s="3"] i { background: var(--s3-fg); } .cal .sd[data-s="4"] i { background: var(--primary); }
.cal .fb { background: var(--accent); color: #fff; border-radius: 6px; padding: 3px 6px; font-size: 12px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(120px, 1fr) 3fr auto; gap: 10px; align-items: center; font-size: 13.5px; }
.bar i { display: block; height: 10px; border-radius: 5px; background: var(--primary); }

/* Tabelas e gráfico */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; }
.chart { display: flex; flex-direction: column; gap: 8px; }
.crow { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 70px; gap: 10px; align-items: center; font-size: 13.5px; }
.crow .t { min-width: 0; overflow-wrap: anywhere; }
.track { height: 16px; display: flex; border-radius: 4px; overflow: hidden; background: var(--soft); }
.track i { display: block; height: 100%; }
.track i[data-n="ig"] { background: var(--c-ig); } .track i[data-n="fb"] { background: var(--c-fb); } .track i[data-n="tt"] { background: var(--c-tt); }
.key { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--k); }
.editor { background: var(--soft); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.editor .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.editor fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0; padding: 10px 12px 12px; min-width: 0; background: var(--surface); }
.editor legend { font-weight: 600; padding: 0 6px; }
.fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.goal { display: grid; grid-template-columns: minmax(150px, 1.3fr) 110px 110px minmax(120px, 1.4fr) 60px; gap: 10px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.goal:last-child { border-bottom: 0; }
.rank { list-style: none !important; padding: 0 !important; display: flex; flex-direction: column; gap: 6px !important; }
.rank li { display: flex; justify-content: space-between; gap: 12px; }

/* Drive, pendências, relatório */
.linkbox { display: flex; flex-wrap: wrap; gap: 8px; }
.linkbox input { flex: 1 1 280px; }
.frow { display: grid; grid-template-columns: minmax(150px, 1.2fr) 2fr auto; gap: 8px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow small { color: var(--muted); display: block; }
.frow label.chk { display: flex; gap: 6px; align-items: center; font-size: 13.5px; white-space: nowrap; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.prow { display: grid; grid-template-columns: 26px minmax(200px, 2fr) minmax(130px, 1fr) minmax(130px, 1fr) 110px; gap: 8px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prow.head { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.prow.done .ttl { text-decoration: line-through; color: var(--muted); }
.prow small { display: block; color: var(--muted); }
.report-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; }
.rep-logo { height: 34px; width: auto; display: none; }
details.tools { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 20px; }
details.tools summary { cursor: pointer; font-weight: 600; }

input[type="email"], input[type="password"] { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 8px 10px; width: 100%; color: var(--ink); }
.userbox { display: flex; align-items: center; gap: 10px; color: #E3D9EA; font-size: 13.5px; position: relative; z-index: 1; flex-wrap: wrap; }
.userbox .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); padding: 5px 12px; }
.userbox .btn:hover { background: rgba(255,255,255,.12); }
.login { max-width: 460px; margin: 0 auto; width: 100%; }
body.locked .tabs, body.locked main, body.locked details.tools { display: none; }
@media (max-width: 720px) {
  body { padding-block: 12px 40px; }
  .top { padding: 20px 18px; border-radius: 18px; }
  .ide-official-logo { height: 40px; max-width: 150px; }
  .logo-badge { padding: 9px 12px; border-radius: 14px; }
  .brand { align-items: flex-start; }
  .tabs { width: 100%; }
  .panel { padding: 16px; }
  .post .row { padding: 14px; }
  .detail { padding: 16px; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .crow { grid-template-columns: 1fr 60px; } .crow .t { grid-column: 1 / -1; }
  .frow { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 1fr auto; } .bar i { grid-column: 1 / -1; }
  .goal { grid-template-columns: 1fr 1fr; } .goal > :first-child { grid-column: 1 / -1; }
  .prow { grid-template-columns: 26px 1fr; } .prow > :nth-child(n+3) { grid-column: 2; }
  .prow.head { display: none; }
  .fields.three { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .chip, .tab, .btn { transition: background-color .15s, color .15s; } }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .top, .noprint, details.tools, .notice, button, .tabs { display: none !important; }
  .rep-logo { display: block; }
  .panel, .post, .kpi { box-shadow: none; break-inside: avoid; }
  .wrap { max-width: none; }
}

    switch (act) {
      case 'status': setPostStatus(id, +val); render(); break;
      case 'pend': o = {}; o[i] = val; savePost(id, { pend: o }); render(); break;
      case 'pend-owner': o = {}; o[i] = String(val).trim() || null; savePost(id, { po: o }); queueRender(); break;
      case 'pend-due': o = {}; o[i] = val || null; savePost(id, { pdue: o }); queueRender(); break;
      case 'p-owner': savePost(id, { owner: String(val).trim() || null }); queueRender(); break;
      case 'p-time': savePost(id, { time: val || null }); queueRender(); break;
      case 'p-appby': savePost(id, { approvedBy: String(val).trim() || null }); break;
      case 'p-note': savePost(id, { note: String(val).trim() || null }); break;
      case 'indrive': savePost(id, { inDrive: !!val }); render(); break;
      case 'plink': if (val && !/^https:\/\//.test(val.trim())) { note('O link precisa começar com https://', true); return; } note(''); savePost(id, { link: val.trim() || null }); break;
      case 'metric': o = { m: {} }; o.m[t.getAttribute('data-n')] = {}; o.m[t.getAttribute('data-n')][k] = numOrNull(val); savePost(id, o); softEng(); queueRender(); break;
      case 'goal-meta': o = { goals: {} }; o.goals[k] = { meta: numOrNull(val) }; saveMeta(o); softEng(); break;
      case 'goal-res': o = { goals: {} }; o.goals[k] = { res: numOrNull(val) }; saveMeta(o); softEng(); break;
      case 'story-status': setStoryStatus(id, +val); render(); break;
      case 'story-check': setStoryCheck(id, k, !!val); render(); break;
      case 'story-metric': o = {}; o[k] = numOrNull(val); saveStory(id, o); setText('ret-' + id, retention(sdoc(id))); break;
      case 'story-note': saveStory(id, { note: String(val).trim() || null }); break;
      case 'fb-date': saveMeta({ feedback: { date: val || '' } }); queueRender(); break;
      case 'fb-check': o = { feedback: { checks: {} } }; o.feedback.checks[i] = !!val; saveMeta(o); render(); break;
      case 'powner': pOwner = val; render(); break;
      case 'paste-text': pasteText = val; break;
      case 'team-papel': sb.from('perfis').update({ papel: val }).eq('id', id).then(function (r) {
          if (r.error) { note('Não foi possível alterar a permissão.', true); loadTeam(); return; }
          team.forEach(function (u) { if (u.id === id) u.papel = val; }); note('Permissão atualizada.'); render();
        }); break;
    }
  }
  document.addEventListener('change', function (e) { var t = e.target; if (t.id === 'backup-file') return; handle(t); });
  var liveT = {};
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t.getAttribute || !t.getAttribute('data-live')) return;
    if (t.getAttribute('data-act') === 'paste-text') { pasteText = t.value; return; }
    var key = (t.getAttribute('data-act') || '') + (t.getAttribute('data-id') || '') + (t.getAttribute('data-n') || '') + (t.getAttribute('data-k') || '');
    clearTimeout(liveT[key]); liveT[key] = setTimeout(function () { handle(t); }, 400);
  });
  document.addEventListener('focusout', function () { setTimeout(function () { if (dirty && !pointerDown && !typing()) queueRender(); }, 0); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'drive-url') { e.preventDefault(); document.querySelector('[data-act="drive-save"]').click(); return; }
    var tb = e.target.closest && e.target.closest('[role="tab"]');
    if (tb && (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Home' || e.key === 'End')) {
      var idx = TABS.map(function (t) { return t[0]; }).indexOf(view), n = TABS.length;
      idx = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : (idx + (e.key === 'ArrowRight' ? 1 : -1) + n) % n;
      view = TABS[idx][0]; render(); $('t-' + view).focus(); e.preventDefault();
    }
  });
  $('backup-file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () { stageImport(String(r.result)); }; r.onerror = function () { note('Não foi possível ler o arquivo de backup.', true); }; r.readAsText(f); e.target.value = '';
  });

  /* ---------- Início ---------- */
  $('subtitle').textContent = CYCLE.name + ' · ' + dm(CYCLE.start) + ' a ' + dm(CYCLE.end) + '/' + pd(CYCLE.end).getFullYear() + ' · 3 posts por semana · TikTok, Instagram e Facebook · stories diários';
  var h0 = (location.hash || '').replace('#', ''); if (TABS.some(function (t) { return t[0] === h0; })) view = h0;
  var CFG = window.IDE_CFG || {}, useRemote = /^https:\/\//.test(CFG.url || '') && CFG.key && CFG.key.indexOf('COLE_AQUI') < 0;
  if (!useRemote) loadLocal();
  render();

  /* Modo compartilhado: só liga quando a página é publicada com o recurso de banco de dados */
  /* ---------- Modo com login (Supabase): a tela de login é a página login.html ---------- */
  function goLogin() { location.replace('login.html'); }
  function applyRow(r) {
    var k = r.chave, d = r.dados; if (!k || !d || typeof d !== 'object') return;
    if (k === 'meta') META = normMeta(d); else if (k.indexOf('post:') === 0) S[k.slice(5)] = d; else if (k.indexOf('story:') === 0) SS[k.slice(6)] = d;
  }
  function enter(session) {
    Promise.all([sb.from('perfis').select('nome,papel,email').eq('id', session.user.id).maybeSingle(), sb.from('painel').select('chave,dados')]).then(function (r) {
      perfil = r[0].data || { nome: session.user.email, papel: 'leitor' }; perfil.id = session.user.id;
      if (perfil.papel !== 'editor') { location.replace('resumo.html'); return; }
      if (r[1].error) { note('Não foi possível carregar os dados. Entre de novo.', true); setTimeout(goLogin, 2000); return; }
      S = {}; SS = {}; META = normMeta(null); (r[1].data || []).forEach(applyRow);
      remote = {}; canWrite = true;
      document.body.classList.remove('locked');
      var ub = $('userbox'); ub.hidden = false;
      ub.innerHTML = '<span>' + esc(perfil.nome || perfil.email || session.user.email) + '</span><span class="pill good">Editor</span><button class="btn" data-act="logout">Sair</button>';
      render();
      sb.channel('painel-live').on('postgres_changes', { event: '*', schema: 'public', table: 'painel' }, function (q) { if (q.new && q.new.chave) { applyRow(q.new); queueRender(); } }).subscribe();
    }, function () { note('Sem conexão. Tente de novo.', true); });
  }
  function startRemote() {
    document.body.classList.add('locked');
    function init() {
      sb = window.supabase.createClient(CFG.url, CFG.key);
      sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') goLogin(); });
      sb.auth.getSession().then(function (r) { if (r.data && r.data.session) enter(r.data.session); else goLogin(); });
    }
    if (window.supabase) init(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload = init; s.onerror = function () { note('Não foi possível carregar o login. Verifique a conexão.', true); }; document.head.appendChild(s); }
  }
  if (useRemote) { startRemote(); return; }

  var cl = window.claude;
  if (cl && cl.use) {
    Promise.all([cl.use('db').catch(function () { return null; }), cl.use('user').catch(function () { return null; })]).then(function (r) {
      if (!r[0]) return; db = r[0];
      var u = r[1]; if (u && u.can) Promise.resolve(u.can('data.write')).then(function (v) { if (v === false) { canWrite = false; render(); } });
      db.collection('posts').onSnapshot(function (s) { S = {}; s.docs.forEach(function (d) { if (d.exists) S[d.id] = clone(d.data()); }); render(); }, function () { note('Não foi possível carregar os dados compartilhados.', true); });
      db.collection('stories').onSnapshot(function (s) { SS = {}; s.docs.forEach(function (d) { if (d.exists) SS[d.id] = clone(d.data()); }); render(); }, function () {});
      db.doc('config/main').onSnapshot(function (d) { META = normMeta(d.exists ? clone(d.data()) : null); render(); }, function () {});
    });
  }
})();
</script>
</body>
</html>
