<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20112F">
<title>Entrar · Painel Ide+</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #F6F3FA; --surface: #FFFFFF; --ink: #21192B; --muted: #6B6377; --line: #E5DEEE;
  --primary: #2D1746; --on-primary: #FFFFFF; --accent: #C52B7C; --soft: #F3ECF8; --bad-fg: #9A1B47;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", -apple-system, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #150C22; --surface: #211333; --ink: #F4EBFB; --muted: #B7A6CB; --line: #3A2653;
    --primary: #C9A6F0; --on-primary: #1B0D2B; --accent: #FF7AB0; --soft: #2B1A44; --bad-fg: #FFB3CB; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* Mobile primeiro: faixa de marca em cima, formulário embaixo ocupando o resto da tela */
.screen { min-height: 100dvh; display: flex; flex-direction: column; }
.hero {
  background: linear-gradient(135deg, #20112F 0%, #2C1841 58%, #3A1F56 100%); color: #fff;
  padding: calc(28px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 52px max(24px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden;
}
.hero::after { content: ""; position: absolute; right: -60px; bottom: -80px; width: 260px; height: 260px; background: radial-gradient(circle, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 70%); pointer-events: none; }
.logo-badge { background: #fff; border-radius: 16px; padding: 10px 16px; display: inline-flex; align-self: flex-start; box-shadow: 0 10px 26px rgba(0,0,0,.18); position: relative; z-index: 1; }
.ide-official-logo { display: block; height: 40px; width: auto; max-width: 150px; object-fit: contain; }
.hero h1 { font-size: 28px; position: relative; z-index: 1; }
.hero p { color: #D7CDDF; font-size: 15px; max-width: 34ch; position: relative; z-index: 1; }

.form-side {
  flex: 1; background: var(--surface); border-radius: 24px 24px 0 0; margin-top: -24px; position: relative; z-index: 2;
  padding: 28px max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; align-items: flex-start;
}
.card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
.card h2 { font-size: 24px; color: var(--primary); }
.note { color: var(--muted); font-size: 14.5px; }
.note:empty { display: none; }
form { display: flex; flex-direction: column; gap: 16px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
input[type="email"], input[type="password"] {
  width: 100%; min-height: 50px; padding: 12px 14px; font-size: 16px; /* 16px evita zoom automático no iPhone */
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
}
input:focus { border-color: var(--accent); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.btn { min-height: 50px; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 16px; cursor: pointer; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.link { border-color: transparent; background: transparent; color: var(--primary); min-height: 44px; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) { .btn, input { transition: background-color .15s, border-color .15s; } }

/* Telas maiores: duas metades, ocupando a tela inteira */
@media (min-width: 900px) {
  .screen { flex-direction: row; }
  .hero { flex: 1 1 50%; justify-content: center; padding: 64px; gap: 24px; }
  .logo-badge { padding: 14px 22px; border-radius: 20px; }
  .ide-official-logo { height: 56px; max-width: 200px; }
  .hero h1 { font-size: 44px; }
  .hero p { font-size: 18px; }
  .form-side { flex: 1 1 50%; background: var(--bg); border-radius: 0; margin-top: 0; align-items: center; padding: 48px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 36px; box-shadow: 0 8px 28px rgba(31,19,46,.06); }
  .actions { flex-direction: row; }
  .actions .btn { flex: 1; }
}
</style>
</head>

    <h1>Painel de marketing</h1>
    <p>Acesso restrito à equipe e à diretoria.</p>
  </section>
  <main class="form-side">
    <div class="card">
      <h2 id="login-title">Entrar no painel</h2>
      <p class="note" id="login-msg" role="status"></p>
      <form id="login-form">
        <label>E-mail<input type="email" id="lg-email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></label>
        <label>Senha<input type="password" id="lg-pass" autocomplete="current-password" required></label>
        <div class="actions">
          <button class="btn primary" type="submit">Entrar</button>
          <button class="btn link" type="button" id="forgot">Esqueci a senha</button>
        </div>
      </form>
      <form id="reset-form" hidden>
        <label>Nova senha (mínimo 8 caracteres)<input type="password" id="rs-pass" autocomplete="new-password" minlength="8" required></label>
        <div class="actions"><button class="btn primary" type="submit">Salvar senha</button></div>
      </form>
    </div>
  </main>
</div>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function msg(m, bad) { var e = $('login-msg'); e.textContent = m || ''; e.style.color = bad ? 'var(--bad-fg)' : ''; }
  var CFG = window.IDE_CFG || {}, sb = null;
  if (!(/^https:\/\//.test(CFG.url || '') && CFG.key && CFG.key.indexOf('COLE_AQUI') < 0)) {
    $('login-form').hidden = true;
    msg(window.IDE_CFG
      ? 'O arquivo config.js foi encontrado, mas a URL e a chave do Supabase ainda não foram preenchidas. Abra o config.js, troque os textos COLE_AQUI... pelos valores do seu projeto e envie o arquivo de novo.'
      : 'O arquivo config.js não foi encontrado. Ele precisa estar na mesma pasta do login.html, com o nome exato config.js.', true);
    return;
  }
  function go(session) {
    msg('Entrando…');
    sb.from('perfis').select('papel').eq('id', session.user.id).maybeSingle().then(function (r) {
      if (r.error) { msg('Não foi possível verificar seu perfil. Tente de novo.', true); return; }
      location.replace(r.data && r.data.papel === 'editor' ? 'painel.html' : 'resumo.html');
    }, function () { msg('Sem conexão. Tente de novo.', true); });
  }
  function init() {
    sb = window.supabase.createClient(CFG.url, CFG.key);
    var needReset = /type=(invite|recovery)/.test(location.hash);
    sb.auth.getSession().then(function (r) {
      if (r.data && r.data.session) {
        if (needReset) { $('login-form').hidden = true; $('reset-form').hidden = false; $('login-title').textContent = 'Criar nova senha'; msg('Crie uma senha para continuar.'); }
        else go(r.data.session);
      } else msg('');
    });
    $('login-form').addEventListener('submit', function (e) {
      e.preventDefault(); msg('Entrando…');
      sb.auth.signInWithPassword({ email: $('lg-email').value.trim(), password: $('lg-pass').value }).then(function (r) {
        if (r.error) msg('E-mail ou senha incorretos.', true); else { $('lg-pass').value = ''; go(r.data.session); }
      }, function () { msg('Sem conexão. Tente de novo.', true); });
    });
    $('forgot').addEventListener('click', function () {
      var em = $('lg-email').value.trim(); if (!em) { msg('Digite seu e-mail acima e clique em "Esqueci a senha".', true); return; }
      sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.split('#')[0] }).then(function (r) { msg(r.error ? 'Não foi possível enviar o e-mail agora.' : 'Se este e-mail tem acesso, você receberá um link para criar uma nova senha.', !!r.error); });
    });
    $('reset-form').addEventListener('submit', function (e) {
      e.preventDefault();
      sb.auth.updateUser({ password: $('rs-pass').value }).then(function (r) {
        if (r.error) msg('Não foi possível salvar a senha: use 8 caracteres ou mais.', true);
        else { history.replaceState(null, '', location.href.split('#')[0]); sb.auth.getSession().then(function (x) { go(x.data.session); }); }
      });
    });
  }
  if (window.supabase) init(); else { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload = init; s.onerror = function () { msg('Não foi possível carregar o login. Verifique a conexão.', true); }; document.head.appendChild(s); }
})();
</script>
</body>
